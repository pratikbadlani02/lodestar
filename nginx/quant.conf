# Quant Platform Nginx config (macOS Homebrew, port 8080)
# Serves React dashboard as static files + proxies /api/ to FastAPI

upstream quant_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen       8080;
    server_name  localhost 127.0.0.1;

    access_log __PLATFORM__/logs/nginx/access.log;
    error_log  __PLATFORM__/logs/nginx/error.log warn;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 256;

    # React dashboard (static build)
    root __PLATFORM__/frontend/dist;
    index index.html;

    # SPA fallback — all non-API routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket — must precede generic /api/ block
    location /api/ws {
        proxy_pass         http://quant_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # API → FastAPI
    location /api/ {
        proxy_pass         http://quant_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
    }

    # Docs pass-through
    location /api/docs {
        proxy_pass http://quant_api/api/docs;
    }
    location /api/openapi.json {
        proxy_pass http://quant_api/api/openapi.json;
    }
}
