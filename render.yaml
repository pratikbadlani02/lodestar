# Render Blueprint — Lodestar
#
# Public market-data viewer. No auth, no trading, no background workers.
# One Docker container serves the API and the built React frontend; a free
# managed Postgres caches OHLCV bars and (optionally) Upstash Redis caches
# fundamentals.
#
# Apply: Render Dashboard → New → Blueprint → point at this repo.

services:
  - type: web
    name: lodestar-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: lodestar-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: lodestar-db
          property: connectionString
      - key: REDIS_URL
        sync: false        # paste from Upstash (rediss://...) — used only for fundamentals cache
      - key: CORS_ORIGINS
        sync: false        # e.g. "https://lodestar-api.onrender.com"
      - key: ALPACA_API_KEY
        sync: false        # market-data only; even a paper key works
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets
      - key: SENTRY_DSN
        sync: false        # optional; leave blank to disable

databases:
  - name: lodestar-db
    plan: free               # 1 GB, expires after 90 days
    region: oregon
    postgresMajorVersion: "16"
