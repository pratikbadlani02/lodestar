# Render Blueprint — Lodestar
#
# Single web service runs API, frontend, and the in-process scheduler
# (APScheduler — see app/scheduler.py). No separate Celery worker or beat.
#
# Apply: Render Dashboard → New → Blueprint → point at this repo.
#
# Free tier caveat: the web instance sleeps after 15min idle. While asleep
# the in-process scheduler does NOT run, so strategies don't tick. During
# market hours, keep it warm with an external pinger hitting /api/health
# every 10min (cron-job.org, uptimerobot, or similar — both free).

services:
  - type: web
    name: lodestar-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false        # set in dashboard
      - key: ADMIN_PASSWORD
        sync: false        # set in dashboard (use a strong value)
      - key: DATABASE_URL
        fromDatabase:
          name: lodestar-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: lodestar-db
          property: connectionString
      - key: REDIS_URL
        sync: false        # paste from Upstash (rediss://...)
      - key: CORS_ORIGINS
        sync: false        # e.g. "https://lodestar-api.onrender.com"
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets
      - key: ALPACA_LIVE_CONFIRMED
        value: "false"
      - key: TRADING_ENABLED
        value: "false"     # flip to true after first successful deploy
      - key: STRATEGIES_ENABLED
        value: "false"

databases:
  - name: lodestar-db
    plan: free               # 1 GB, expires after 90 days
    region: oregon
    postgresMajorVersion: "16"
